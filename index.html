function iso(date){const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,'0'),d=String(date.getDate()).padStart(2,'0');return `${y}-${m}-${d}`}
function fromISO(str){const [y,m,d]=str.split('-').map(Number);return new Date(y,m-1,d,12)}
function monday(date){const d=new Date(date);d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}

function fullDate(date){return `${DAYS[date.getDay()]} ${date.getDate()} de ${MONTHS[date.getMonth()]}`}
function cleanNumber(v){const n=Number(String(v).replace(',','.'));return Number.isFinite(n)?n:0}

function chartSVG(){const m=state.measurements.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(-12).filter(x=>cleanNumber(x.weight)>0);if(m.length<2)return `<div class="empty">Registra al menos dos pesos para ver la evolución.</div>`;const values=m.map(a=>cleanNumber(a.weight));let mi=Math.min(...values)-1,ma=Math.max(...values)+1;if(mi===ma)ma=mi+1;const x=i=>24+i*290/(m.length-1),y=v=>133-(v-mi)/(ma-mi)*111;let path=values.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');return `<svg class="graph" role="img" aria-label="Gráfica de evolución del peso corporal" viewBox="0 0 340 160" preserveAspectRatio="none">${[0,.5,1].map(t=>`<line class="gridline" x1="24" y1="${133-111*t}" x2="328" y2="${133-111*t}"/><text x="0" y="${136-111*t}">${(mi+(ma-mi)*t).toFixed(0)}</text>`).join('')}<path class="line" d="${path}"/>${values.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="4.5" fill="#cefa6b" stroke="#17211f" stroke-width="2"/>`).join('')}<text x="24" y="155">${safe(m[0].date.slice(5))}</text><text x="276" y="155">${safe(m[m.length-1].date.slice(5))}</text></svg>`}

ass="tip">Una reducción gradual de grasa, acompañada de fuerza y suficiente proteína, mejora la definición muscular. El peso por sí solo no cuenta toda la historia.</div>`}

function saveRun(date){let km=cleanNumber(document.getElementById('runKm').value),minutes=cleanNumber(document.getElementById('runMin').value),rpe=Number(document.getElementById('runRpe').value);if(!(km>0&&km<=100&&minutes>0&&minutes<=600)){notify('Escribe distancia y tiempo válidos');return}state.logs[date]={kind:'run',km:Math.round(km*100)/100,min:Math.round(minutes),rpe,completed:true,updated:new Date().toISOString()};store();notify('¡Carrera guardada!');render()}
function exportData(){const text=JSON.stringify({...state,exportDate:new Date().toISOString(),schema:'forma_v1'},null,2);const blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`forma-respaldo-${iso(new Date())}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);notify('Copia exportada')}
async function importData(file){if(!file)return;try{const parsed=JSON.parse(await file.text());if(!parsed.profile||!parsed.logs||!parsed.sets||!Array.isArray(parsed.measurements))throw new Error('Formato inválido');if(!confirm('¿Reemplazar todos los registros actuales por los del respaldo?'))return;state={profile:{...DEFAULT.profile,...parsed.profile},logs:parsed.logs,sets:parsed.sets,measurements:parsed.measurements,settings:{...DEFAULT.settings,...parsed.settings}};store();navigate('profile');notify('Datos restaurados')}catch(e){notify('No se pudo importar el archivo')}}
document.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(!target)return;const act=target.dataset.action;switch(act){case 'nav':navigate(target.dataset.page);break;case 'selectday':selected=target.dataset.date;render();break;case 'openworkout':workoutDate=target.dataset.date;selected=workoutDate;render();window.scrollTo(0,0);break;case 'back':workoutDate=null;render();window.scrollTo(0,0);break;case 'toggleset':toggleSet(target.dataset.date,target.dataset.ex,Number(target.dataset.idx));break;case 'finishstrength':{const stat=countSets(target.dataset.date);if(stat.done===0){notify('Marca al menos una serie antes de terminar');return}state.logs[target.dataset.date]={kind:'strength',completed:true,sets:stat.done,updated:new Date().toISOString()};store();render();notify('¡Buen trabajo! Sesión completada');break}case 'unfinish':delete state.logs[target.dataset.date];store();render();notify('Sesión reabierta');break;case 'saverun':saveRun(target.dataset.date);break;case 'saveweight':{const kg=cleanNumber(document.getElementById('measureWeight').value),waist=cleanNumber(document.getElementById('measureWaist').value),date=iso(new Date());if(kg<30||kg>350||(waist&&(waist<30||waist>220))){notify('Revisa los valores de la medición');return}state.measurements=state.measurements.filter(v=>v.date!==date);state.measurements.push({date,weight:kg,waist:waist||null});state.profile.weight=kg;store();render();notify('Medición guardada');break}case 'saveprofile':{const name=document.getElementById('profileName').value.trim(),weight=cleanNumber(document.getElementById('profileWeight').value),height=cleanNumber(document.getElementById('profileHeight').value),start=document.getElementById('profileStart').value;if(!name||weight<30||weight>350||height<100||height>240||!/^\d{4}-\d{2}-\d{2}$/.test(start)){notify('Revisa los datos del perfil');return}state.profile={...state.profile,name,weight,height,start};store();render();notify('Perfil actualizado');break}case 'export':exportData();break;case 'import':document.getElementById('importFile').click();break;case 'reset':if(confirm('¿Borrar todos los entrenamientos, carreras y medidas? No se puede deshacer.')){localStorage.removeItem('forma_v1');state=JSON.parse(JSON.stringify(DEFAULT));selected=iso(new Date());navigate('home');notify('Registros borrados')}break;case 'timer':modal='timer';timerSec=90;timerEnd=null;drawModal();break;case 'closemodal':modal=null;drawModal();break;case 'timerpreset':timerSec=Number(target.dataset.seconds);timerEnd=null;drawModal();break;case 'timerreset':timerEnd=null;timerSec=90;drawModal();break;case 'timerstart':if(timerEnd){timerSec=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));timerEnd=null}else{timerEnd=Date.now()+timerSec*1000;if(!timerInterval)timerInterval=setInterval(tickTimer,250)}drawModal();break;}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='importFile'){importData(t.files?.[0]);return}if(!t.matches('[data-set-ex]'))return;const key=setID(t.dataset.setDate,t.dataset.setEx,Number(t.dataset.setIndex));const old=state.sets[key]||{kg:'',reps:'',done:false};let value=t.value;if(value!==''&&(!Number.isFinite(Number(value))||Number(value)<0||Number(value)>999)){notify('Escribe un valor válido');t.value=old[t.dataset.prop];return}state.sets[key]={...old,[t.dataset.prop]:value};store()});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.plan-card')){e.preventDefault();e.target.click()}});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
render();
})();
</script>
</body>
